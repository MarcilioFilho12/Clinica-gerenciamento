[build]
builder = "NIXPACKS"
# Front (Vite) não entra neste serviço — ver nixpacks.toml (providers = php)
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs"

[deploy]
# Painel Railway: Root Directory = Back-end-clinica
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"

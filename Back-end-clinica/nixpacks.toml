# API Laravel no Railway — só PHP (front Vue fica na Vercel).
# Evita detecção de package.json/yarn.lock e a colisão
# yarn/LICENSE vs composer/LICENSE no Nixpacks.

providers = ["php"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
]

[phases.build]
cmds = []

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
